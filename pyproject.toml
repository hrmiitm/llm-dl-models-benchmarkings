[project]
name = "llm-dl-models-benchmarkings"
version = "0.1.0"
description = "Financial sentiment benchmarking of OpenRouter LLMs and local classifiers"
readme = "README.md"
authors = [
    { name = "hrmiitm", email = "hrithik999999@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.0,<2",
    "requests>=2.32,<3",
]

[project.optional-dependencies]
dl = [
    "torch>=2.6,<3",
    "transformers>=4.48,<6",
    "sentencepiece>=0.2,<1",
    "protobuf>=4.25,<8",
]
data = ["huggingface-hub>=0.26,<3"]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
